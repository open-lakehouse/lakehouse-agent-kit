name: skills-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint skills (frontmatter, size, portability, links)
        run: python3 -I scripts/lint_skills.py
      - name: Linter self-test
        run: python3 -I scripts/lint_skills.py --self-test
      - name: Profile loader self-test (includes template parity check)
        run: python3 -I skills/lakehouse-core/scripts/load_profile.py --self-test
      - name: Version floor helper self-test
        run: python3 -I skills/lakehouse-core/scripts/version_floor.py --self-test
      - name: Endpoint resolver self-test
        run: python3 -I skills/lakehouse-core/scripts/resolve_endpoint.py --self-test
