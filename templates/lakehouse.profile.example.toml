# Lakehouse connection profile (example)
#
# The toolkit's skills are stack-agnostic: every endpoint, credential, and invocation
# mode a skill needs comes from a profile like this one — NOT from hardcoded hosts/ports.
# `lakehouse-core` loads and validates the active profile and refuses to guess one.
#
# Copy to  lakehouse.profile.toml  (or export the env vars) and fill in your deployment.
# A ready-made `reference-stack.profile.toml` reproduces the open-lakehouse compose values.

[profile]
name = "default"

# How skills invoke engine CLIs. One of: "local" | "docker" | "k8s".
# - local : binaries on PATH (spark-submit, spark-sql, kafka-*.sh, airflow, mlflow)
# - docker: run inside named containers (set *_container below)
# - k8s   : kubectl exec into pods (set *_pod/namespace below)
invocation = "local"

[spark]
connect_uri = "sc://SPARK_HOST:15002"   # Spark Connect endpoint
container    = ""                        # used when invocation = "docker"
image_notes  = ""                        # e.g. stock apache/spark image quirks, if relevant

[unity_catalog]
rest_url     = "http://UC_HOST:8080/api/2.1/unity-catalog"
iceberg_rest = "http://UC_HOST:8080/api/2.1/unity-catalog/iceberg/v1"
token_env    = "LAKEHOUSE_UC_TOKEN"      # name of the env var holding the token

[kafka]
bootstrap_servers = "KAFKA_HOST:9092"
container          = ""

[object_store]
kind          = "s3"                     # s3-compatible (SeaweedFS, MinIO, AWS S3, …)
s3_endpoint   = "http://OBJECT_STORE_HOST:8333"
bucket        = "lakehouse"
warehouse     = "s3://lakehouse/warehouse"
access_key_env = "LAKEHOUSE_S3_ACCESS_KEY"
secret_key_env = "LAKEHOUSE_S3_SECRET_KEY"

[mlflow]
tracking_uri = "http://MLFLOW_HOST:5000"
gateway_uri  = "http://MLFLOW_HOST:5001"

[airflow]
base_url   = "http://AIRFLOW_HOST:8080"
container  = ""

[delta_sharing]
endpoint = "https://SHARING_HOST:8443"

[naming]
# Overridable defaults so skills don't assume one deployment's catalog/schema names.
default_catalog = "lakehouse"
schemas         = ["bronze", "silver", "gold"]
