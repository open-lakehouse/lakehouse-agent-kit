# Lakehouse connection profile — the open-lakehouse REFERENCE STACK (Docker Compose).
#
# A concrete, ready-to-use profile for https://github.com/open-lakehouse/open-lakehouse,
# reproducing its compose values as seen from the HOST (published ports on localhost).
# It is a different deployment from the generic templates/lakehouse.profile.example.*:
# it remaps ports to avoid collisions (UC on 8081, Airflow on 8085) and uses SeaweedFS's
# S3 port 8333. The resolver's generic preferred defaults are NOT changed by this file.
#
# Use it:  python3 -I skills/lakehouse-core/scripts/load_profile.py --file templates/reference-stack.profile.toml
#          (or copy it to ~/.config/lakehouse/ and select it with --profile reference-stack)
#
# Every value is verified against open-lakehouse/open-lakehouse @ 39f32e68191828f39dc1f21d41d20506b5d4a292
# (2026-10-27); the cited path:line is in that commit. Secrets stay in env vars named
# by the *_env keys (the stack's own .env names); never put their values here.

[profile]
name       = "reference-stack"
invocation = "docker"     # CLIs run via `docker exec` (lakehouse:1145, :1130)

[spark]
connect_uri = "sc://localhost:15002"   # docker-compose-spark41.yml:103 "15002:15002" (spark-connect-41)
container   = "spark-master-41"        # docker-compose-spark41.yml:22; spark-submit runs here (lakehouse:1145)

[unity_catalog]
rest_url     = "http://localhost:8081/api/2.1/unity-catalog"          # docker-compose-unity-catalog.yml:46 "8081:8080"
iceberg_rest = "http://localhost:8081/api/2.1/unity-catalog/iceberg"  # docker-compose-unity-catalog.yml:19

[kafka]
bootstrap_servers = "localhost:9092"   # docker-compose-kafka.yml:28 "9092:19092", :34 EXTERNAL://localhost:9092
container         = "kafka"            # docker-compose-kafka.yml:24

[object_store]
kind           = "s3"
s3_endpoint    = "http://localhost:8333"      # docker-compose-storage.yml:60 "8333:8333"; .env.example:11
bucket         = "lakehouse"                  # .env.example:14 S3_BUCKET
warehouse      = "s3a://lakehouse/warehouse"  # .env.example:15 S3_WAREHOUSE
region         = "us-east-1"                  # docker-compose-sharing.yml:48; docker/delta-sharing/server.yaml
path_style     = true                         # config/spark/spark-defaults.conf.example (fs.s3a.path.style.access true)
access_key_env = "S3_ACCESS_KEY"              # .env.example:12 (variable NAME only)
secret_key_env = "S3_SECRET_KEY"              # .env.example:13 (variable NAME only)

[mlflow]
tracking_uri = "http://localhost:5000"   # docker-compose-mlflow.yml:21 "5000:5000"
gateway_uri  = "http://localhost:5001"   # docker-compose-mlflow.yml:22 "5001:5001"
container    = "mlflow-server"           # docker-compose-mlflow.yml:19

[airflow]
base_url     = "http://localhost:8085"   # docker-compose-airflow.yml:81 "8085:8085", :22 AIRFLOW__API__PORT
container    = "airflow-webserver"       # docker-compose-airflow.yml:78
username_env = "AIRFLOW_ADMIN_USER"      # .env.example:21 (variable NAME only)
password_env = "AIRFLOW_ADMIN_PASSWORD"  # .env.example:22 (variable NAME only)

[delta_sharing]
endpoint         = "https://localhost:8443/delta-sharing"  # docker-compose-sharing.yml:42 (127.0.0.1:8443), lakehouse:3113
bearer_token_env = "DELTA_SHARING_TOKEN"                   # docker-compose-sharing.yml DELTA_SHARING_TOKEN
